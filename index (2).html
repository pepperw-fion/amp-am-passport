<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<title>学习护照 · 安湃声区域经理发展项目</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--red:#C8102E;--red-d:#8B0A1E;--red-l:#FDF1F3;--red-m:#F2CDD4;--red-i:rgba(200,16,46,.10);
--t1:#14161A;--t2:#5C6270;--t3:#9AA0AC;
--bg:#fff;--bg2:#F7F8FA;--bg3:#EFF1F4;
--b1:#E8EAEE;--b2:#D6DAE1;
--gr:#2D6A2E;--gr-l:#EAF4EA;
--am:#8A5A08;--am-l:#FDF3E2;
--nv:#1E2A3D;--nv-l:#EEF1F6;
--r:10px;--rl:16px;--side:232px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg2);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:14px}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hide{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}

#login{min-height:100dvh;display:flex;background:var(--bg)}
.lg-art{flex:1;background:var(--red);display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative;overflow:hidden}
.lg-art::after{content:"";position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;border:1px solid rgba(255,255,255,.18);border-radius:50%}
.lg-art::before{content:"";position:absolute;right:-40px;bottom:-60px;width:260px;height:260px;border:1px solid rgba(255,255,255,.14);border-radius:50%}
.lg-brand{font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.75);font-weight:500}
.lg-big{font-size:40px;color:#fff;font-weight:500;line-height:1.2;letter-spacing:-.5px}
.lg-desc{font-size:14px;color:rgba(255,255,255,.72);margin-top:14px;line-height:1.8;max-width:340px}
.lg-foot{font-size:12px;color:rgba(255,255,255,.5)}
.lg-form{width:440px;display:flex;align-items:center;justify-content:center;padding:40px}
.lg-in{width:100%;max-width:320px}
.lg-t{font-size:24px;font-weight:500;margin-bottom:4px}
.lg-s{font-size:13px;color:var(--t2);margin-bottom:28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--t2);margin-bottom:6px;font-weight:500}
.fld input{width:100%;padding:11px 13px;border:1px solid var(--b2);border-radius:var(--r);font-size:15px;background:var(--bg);transition:.15s}
.fld input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-i)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:var(--r);font-size:14px;font-weight:500;background:var(--red);color:#fff;transition:.15s}
.btn:hover{background:var(--red-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn-sm{width:auto;padding:7px 13px;font-size:13px;border-radius:8px}
.btn-gh{background:var(--bg);color:var(--t1);border:1px solid var(--b2)}
.btn-gh:hover{background:var(--bg2)}
.btn-nv{background:var(--nv)}
.btn-nv:hover{background:#141d2b}
.err{background:var(--red-l);color:var(--red-d);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.lg-hint{font-size:12px;color:var(--t3);margin-top:20px;text-align:center}
@media(max-width:860px){.lg-art{display:none}.lg-form{width:100%}}

#app{min-height:100dvh}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--bg);border-right:1px solid var(--b1);display:flex;flex-direction:column;z-index:40}
.side-top{padding:18px 18px 14px;border-bottom:1px solid var(--b1)}
.side-logo{font-size:10px;letter-spacing:2px;color:var(--red);font-weight:600}
.side-app{font-size:15px;font-weight:500;margin-top:3px}
.side-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--t2);width:100%;transition:.12s;margin-bottom:2px}
.nv:hover{background:var(--bg2);color:var(--t1)}
.nv.on{background:var(--red-l);color:var(--red-d);font-weight:500}
.nv i{font-size:18px}
.nv-c{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.side-bot{padding:12px 10px;border-top:1px solid var(--b1)}
.usr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
.usr-av{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.usr-i{flex:1;min-width:0}
.usr-n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-r{font-size:11px;color:var(--t3)}
.usr-x{color:var(--t3);font-size:17px;padding:4px}
.usr-x:hover{color:var(--red)}

.wrap{margin-left:var(--side);min-height:100dvh}
.hd{background:var(--bg);border-bottom:1px solid var(--b1);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.hd-t{font-size:17px;font-weight:500}
.hd-s{font-size:12.5px;color:var(--t2);margin-top:1px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.icb{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:18px;position:relative;border:1px solid var(--b1)}
.icb:hover{background:var(--bg2);color:var(--t1)}
.icb .dt{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid var(--bg)}
.body{padding:24px 28px 60px;max-width:960px}
.mnav{display:none}
@media(max-width:860px){
.side{display:none}
.wrap{margin-left:0;padding-bottom:66px}
.hd{padding:14px 16px}
.hd-t{font-size:16px}
.body{padding:16px 16px 40px}
.mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--b1);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.mnav button{flex:1;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--t3)}
.mnav button.on{color:var(--red)}
.mnav i{font-size:21px}
}

.card{background:var(--bg);border:1px solid var(--b1);border-radius:var(--rl);padding:20px;margin-bottom:14px}
.card.flat{padding:0;overflow:hidden}
.card-b{padding:6px 18px}
.lbl{font-size:11px;color:var(--t3);letter-spacing:1.3px;font-weight:600;margin:24px 0 10px}
.lbl:first-child{margin-top:0}

.hero{background:var(--red);border-radius:var(--rl);padding:26px 28px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border:1px solid rgba(255,255,255,.16);border-radius:50%}
.hero::before{content:"";position:absolute;right:-20px;top:-20px;width:140px;height:140px;border:1px solid rgba(255,255,255,.12);border-radius:50%}
.hero-e{font-size:10px;letter-spacing:2.5px;color:rgba(255,255,255,.6);margin-bottom:9px}
.hero-n{font-size:27px;font-weight:500;letter-spacing:-.3px}
.hero-m{font-size:13px;color:rgba(255,255,255,.75);margin-top:2px}
.hero-tags{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.htag{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 11px;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.hero-p{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);position:relative;z-index:1}
.hero-pr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
.hero-pl{font-size:12.5px;color:rgba(255,255,255,.85)}
.hero-pn{font-size:30px;font-weight:500;line-height:1}
.trk{height:5px;background:rgba(255,255,255,.24);border-radius:3px;overflow:hidden}
.trk>div{height:100%;background:#fff;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

.jr{position:relative;padding-left:52px}
.jr::before{content:"";position:absolute;left:21px;top:14px;bottom:14px;width:2px;background:var(--b1)}
.jr-mon{position:relative;font-size:11px;color:var(--t3);font-weight:600;letter-spacing:1px;margin:20px 0 10px}
.jr-mon:first-child{margin-top:0}
.jr-mon::before{content:"";position:absolute;left:-38px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg2);border:2px solid var(--b2)}
.jr-mon.act::before{background:var(--red);border-color:var(--red)}
.jn{position:relative;background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:13px;transition:.15s}
.jn.can{cursor:pointer}
.jn.can:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(200,16,46,.07)}
.jn.lk{opacity:.55}
.jn.done{border-color:var(--red-m);background:var(--red-l)}
.jr-line{position:absolute;left:-31px;top:50%;width:22px;height:1.5px;background:var(--b1)}
.seal{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative}
.seal.done{background:var(--red);color:#fff}
.seal.done::after{content:"";position:absolute;inset:-6px;border:1.5px dashed var(--red-m);border-radius:50%;transform:rotate(-12deg)}
.seal.wait{background:var(--am-l);color:var(--am);border:1.5px dashed var(--am)}
.seal.open{background:var(--bg2);color:var(--t2);border:1.5px solid var(--b2)}
.seal.lk{background:var(--bg3);color:var(--t3);border:1.5px dashed var(--b2)}
.seal.cnt{background:var(--nv);color:#fff;flex-direction:column}
.seal.cnt b{font-size:17px;font-weight:500;line-height:1.1}
.seal.cnt span{font-size:8px;opacity:.7;line-height:1}
.jn-m{flex:1;min-width:0}
.jn-t{font-size:14px;font-weight:500;line-height:1.4}
.jn-s{font-size:12px;color:var(--t2);margin-top:2px}
.jn-r{flex-shrink:0;display:flex;align-items:center;gap:8px}

.bg{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
.bg.ok{background:var(--gr-l);color:var(--gr)}
.bg.wt{background:var(--am-l);color:var(--am)}
.bg.td{background:var(--bg3);color:var(--t2)}
.bg.rj{background:var(--red-l);color:var(--red-d)}
.bg.rd{background:var(--red);color:#fff}
.bn{border-radius:var(--r);padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;line-height:1.65}
.bn i{font-size:17px;flex-shrink:0;margin-top:1px}
.bn.red{background:var(--red-l);color:var(--red-d)}
.bn.grn{background:var(--gr-l);color:var(--gr)}
.bn.amb{background:var(--am-l);color:var(--am)}
.bn.nvy{background:var(--nv-l);color:var(--nv)}

.rw{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--b1)}
.rw:last-child{border-bottom:none}
.rw-i{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rw-m{flex:1;min-width:0}
.rw-t{font-size:13.5px;font-weight:500}
.rw-s{font-size:11.5px;color:var(--t2);margin-top:1px}
.rw-r{flex-shrink:0;display:flex;align-items:center;gap:8px}

.pc{background:var(--bg);border:1px solid var(--b1);border-radius:12px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pc:hover{border-color:var(--nv);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.pc-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.pc-n{font-size:13.5px;font-weight:500}
.pc-c{font-size:11px;color:var(--t3);font-weight:400;margin-left:4px}
.pc-m{font-size:11.5px;color:var(--t2);margin-top:1px}
.pc-p{font-size:17px;font-weight:500;color:var(--nv)}
.pc-k{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:6px}
.pc-k>div{height:100%;background:var(--nv);border-radius:2px;transition:width .5s}
.pc-k>div.f{background:var(--red)}
.pc-d{display:flex;gap:3px}
.pc-d>i{flex:1;height:4px;border-radius:2px;background:var(--bg3);display:block}
.pc-d>i.e{background:var(--red)}
.pc-d>i.p{background:var(--red-m)}

.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.st{background:var(--bg);border:1px solid var(--b1);border-radius:12px;padding:15px 16px}
.st-n{font-size:26px;font-weight:500;line-height:1.15;color:var(--nv);letter-spacing:-.5px}
.st-n.r{color:var(--red)}
.st-l{font-size:11.5px;color:var(--t2);margin-top:3px}

.ov{position:fixed;inset:0;background:rgba(15,18,24,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.mo{background:var(--bg);border-radius:18px;width:100%;max-width:490px;max-height:88dvh;overflow-y:auto}
.mo-h{padding:20px 22px 0;display:flex;justify-content:space-between;gap:12px}
.mo-t{font-size:17px;font-weight:500}
.mo-s{font-size:12.5px;color:var(--t2);margin-top:2px}
.mo-x{font-size:21px;color:var(--t3);line-height:1;padding:2px}
.mo-b{padding:16px 22px 22px}
.mo-c{text-align:center;padding:34px 26px}
.mo-cr{width:78px;height:78px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;position:relative}
.mo-cr::after{content:"";position:absolute;inset:-9px;border:2px dashed var(--red-m);border-radius:50%;transform:rotate(-12deg)}
@media(max-width:860px){.ov{align-items:flex-end;padding:0}.mo{max-width:100%;border-radius:20px 20px 0 0;max-height:92dvh}}

.up{border:1.5px dashed var(--b2);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg2);margin-top:10px}
.up:hover{border-color:var(--red);background:var(--red-l)}
.up i{font-size:24px;color:var(--t3);display:block;margin-bottom:6px}
.up-t{font-size:13px;color:var(--t2)}
.up-s{font-size:11.5px;color:var(--t3);margin-top:2px}
.fr{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:9px;padding:10px 12px;margin-top:9px}
.fr i{font-size:18px;color:var(--gr)}
.fr-n{flex:1;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{width:100%;padding:10px 12px;border:1px solid var(--b2);border-radius:9px;font-size:13px;resize:vertical;min-height:72px}
.ta:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-i)}
.nt{padding:13px 0;border-bottom:1px solid var(--b1)}
.nt:last-child{border-bottom:none}
.nt.new{position:relative;padding-left:15px}
.nt.new::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;background:var(--red);border-radius:50%}
.nt-b{font-size:13px;line-height:1.6}
.nt-m{font-size:11px;color:var(--t3);margin-top:3px}
.emp{text-align:center;padding:46px 20px;color:var(--t3)}
.emp i{font-size:40px;display:block;margin-bottom:12px;opacity:.45}
.emp-t{font-size:14px;color:var(--t2)}
.emp-s{font-size:12.5px;margin-top:5px}
.spn{width:26px;height:26px;border:2.5px solid var(--b1);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;margin:44px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sub-c{background:var(--bg);border:1px solid var(--b1);border-radius:12px;padding:14px;margin-bottom:10px}
</style>
</head>
<body>

<div id="login">
  <div class="lg-art">
    <div class="lg-brand">AMPLIFON · 安湃声</div>
    <div>
      <div class="lg-big">学习护照</div>
      <div class="lg-desc">区域经理发展项目 2026–2027<br>完成每一站，收集属于你的印章</div>
    </div>
    <div class="lg-foot">Global Area Manager Development Program</div>
  </div>
  <div class="lg-form"><div class="lg-in">
    <div class="lg-t">登录</div>
    <div class="lg-s">请输入你的账号与密码</div>
    <div id="lgErr" class="err hide"></div>
    <div class="fld"><label>账号</label>
      <input id="inCode" type="text" placeholder="例如 AM01" autocapitalize="characters" autocomplete="username"></div>
    <div class="fld"><label>密码</label>
      <input id="inPwd" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn" style="margin-top:6px">登录</button>
    <div class="lg-hint">忘记密码请联系 HR 重置</div>
  </div></div>
</div>

<div id="app" class="hide">
  <aside class="side">
    <div class="side-top">
      <div class="side-logo">AMPLIFON</div>
      <div class="side-app">学习护照</div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-bot">
      <div class="usr">
        <div class="usr-av" id="avT">—</div>
        <div class="usr-i"><div class="usr-n" id="usrN">—</div><div class="usr-r" id="usrR">—</div></div>

        <button class="icb" id="btnOut2" aria-label="退出登录"><i class="ti ti-logout"></i></button>
      </div>
    </header>
    <div class="body" id="view"><div class="spn"></div></div>
  </div>
  <nav class="mnav" id="mnav"></nav>
</div>

<script type="module">

const S={me:null,stamps:[],assigns:[],groups:[],prog:[],subs:[],live:[],notifs:[],people:[],tab:'',vu:null}
const $=i=>document.getElementById(i)

const fmt=d=>{if(!d)return'';const x=new Date(d);return x.getMonth()+1+'月'+x.getDate()+'日'}

async function doLogin(){
  const c=$('inCode').value.trim().toUpperCase(),p=$('inPwd').value

function pOf(u,s){return S.prog.find(p=>p.user_id===u&&p.stamp_id===s)}
function stState(u,st){
  if(st.complete_type==='counter')return'counter'
  const p=pOf(u,st.id)
  if(p&&p.status==='earned')return'earned'
  if(st.unlock_date&&new Date(st.unlock_date)>new Date())return'locked'
  if(st.complete_type==='assignment'){
    const ids=S.assigns.filter(a=>a.stamp_id===st.id).map(a=>a.id)
    const m=S.subs.filter(s=>s.user_id===u&&ids.includes(s.assignment_id))
    if(m.some(s=>s.status==='submitted'))return'pending'
    if(m.length===ids.length&&m.every(s=>s.status==='approved'))return'pending'
    return'open'
  }
  if(p&&(p.status==='signed_in'||p.status==='pending'))return'pending'
  return'open'
}
function gotN(u){return CORE().filter(s=>stState(u,s)==='earned').length}
function lvN(u){return S.live.filter(l=>l.user_id===u&&l.confirmed).length}

function monOf(st){
  if(!st.unlock_date)return'全程'
  const d=new Date(st.unlock_date)
  return d.getFullYear()+'年 '+(d.getMonth()+1)+'月'
}

function myLs(){const a=S.people.filter(p=>p.role==='learner');return isGl()?a:a.filter(p=>p.group_id===S.me.group_id)}
function pendN(u){
  let n=0;const r=S.me.role
  S.stamps.forEach(st=>{
    if(st.complete_type==='counter'){if(r==='hrbp'||isGl())n+=S.live.filter(l=>l.user_id===u&&!l.confirmed).length;return}
    if(st.complete_type==='assignment'){
      if((st.needs_rad&&r==='rad')||(st.needs_hrbp&&r==='hrbp')||isGl()){
        const ids=S.assigns.filter(a=>a.stamp_id===st.id).map(a=>a.id)
        n+=S.subs.filter(s=>s.user_id===u&&ids.includes(s.assignment_id)&&s.status==='submitted').length}
      return}
    const p=pOf(u,st.id);if(!p||p.status==='todo'||p.status==='earned')return
    if(st.needs_hrbp&&(r==='hrbp'||isGl())&&!p.hrbp_ok_at)n++
    if(st.needs_rad&&(r==='rad'||isGl())&&!p.rad_ok_at)n++
    if(st.needs_hr&&isGl()&&!p.hr_ok_at)n++})
  return n
}
function vOver(){
  const ls=myLs(),tot=CORE().length,must=ls.filter(p=>p.must_complete)
  const pend=ls.reduce((s,p)=>s+pendN(p.id),0)

  const stz=ls.reduce((s,p)=>s+gotN(p.id),0)
  const byG={};ls.forEach(p=>{const g=p.group_id||'—';if(!byG[g])byG[g]=[];byG[g].push(p)})

    +'<div class="st"><div class="st-n r">'+pend+'</div><div class="st-l">待我审批</div></div>'
    +'<div class="st"><div class="st-n">'+stz+'</div><div class="st-l">已获印章</div></div>'
    +'<div class="st"><div class="st-n">'+grad+'/'+must.length+'</div><div class="st-l">达成毕业</div></div></div>'
  Object.keys(byG).sort().forEach(g=>{

    h+='<div class="lbl">'+esc(gr?gr.name:g)+' · '+ps.length+' 人</div>'
      +ps.sort((a,b)=>a.user_code.localeCompare(b.user_code)).map(p=>pCard(p,tot)).join('')
  })
  return h

function pCard(p,tot){
  const g=gotN(p.id),pct=Math.round(g/tot*100),pd=pendN(p.id)
  return '<div class="pc" data-u="'+p.id+'"><div class="pc-t"><div>'

    +'<div class="pc-m">'+(p.user_type==='expert'?'专家 · 自愿':'区域经理')+' · '+g+'/'+tot+' 章 · 直播 '+lvN(p.id)+' 次</div></div>'
    +'<div style="display:flex;align-items:center;gap:9px">'+(pd?'<span class="bg wt">'+pd+' 待审</span>':'')
    +'<div class="pc-p" style="'+(g===tot?'color:var(--red)':'')+'">'+pct+'%</div></div></div>'
    +'<div class="pc-k"><div class="'+(g===tot?'f':'')+'" style="width:'+pct+'%"></div></div>'
    +'<div class="pc-d">'+CORE().map(s=>{const t=stState(p.id,s);return '<i class="'+(t==='earned'?'e':t==='pending'?'p':'')+'"></i>'}).join('')+'</div></div>'
}
function myTasks(){
  if(!S.me||S.me.role==='learner')return[]
  const r=S.me.role,o=[]
  myLs().forEach(u=>S.stamps.forEach(st=>{
    if(st.complete_type==='counter'){
      if(r==='hrbp'||isGl())S.live.filter(l=>l.user_id===u.id&&!l.confirmed).forEach(l=>o.push({k:'live',u:u,st:st,live:l}))
      return}
    if(st.complete_type==='assignment'){
      const cr=st.needs_rad&&(r==='rad'||isGl()),ch=st.needs_hrbp&&(r==='hrbp'||isGl())
      if(!cr&&!ch)return
      S.assigns.filter(a=>a.stamp_id===st.id).forEach(a=>
        S.subs.filter(s=>s.user_id===u.id&&s.assignment_id===a.id&&s.status==='submitted')
          .forEach(s=>o.push({k:'sub',u:u,st:st,as:a,sub:s})))
      return}
    const p=pOf(u.id,st.id);if(!p||p.status==='todo'||p.status==='earned')return
    if(st.needs_hrbp&&(r==='hrbp'||isGl())&&!p.hrbp_ok_at)o.push({k:'sign',u:u,st:st,p:p,ar:'hrbp'})
    if(st.needs_rad&&(r==='rad'||isGl())&&!p.rad_ok_at)o.push({k:'sign',u:u,st:st,p:p,ar:'rad'})
    if(st.needs_hr&&isGl()&&!p.hr_ok_at)o.push({k:'sign',u:u,st:st,p:p,ar:'hr'})
  }))
  return o
}

  if(x.k==='sub')return '<div class="rw"><div class="rw-i" style="background:var(--am-l);color:var(--am)"><i class="ti ti-file-spreadsheet"></i></div>'
    +'<div class="rw-m"><div class="rw-t">'+esc(x.as.title)+'</div><div class="rw-s">'+esc(x.sub.file_name||'')+' · '+fmt(x.sub.submitted_at)+'</div></div>'
    +'<div class="rw-r"><button class="btn btn-sm btn-gh" data-vs="'+x.sub.id+'">查看</button></div></div>'
  return '<div class="rw"><div class="rw-i" style="background:var(--red-l);color:var(--red)"><i class="ti ti-map-pin"></i></div>'
    +'<div class="rw-m"><div class="rw-t">'+esc(x.st.name)+'</div><div class="rw-s">签到确认 · '+rn+' · '+fmt(x.p.signed_in_at)+'</div></div>'
    +'<div class="rw-r"><button class="btn btn-sm" data-oks="'+x.p.id+'|'+x.ar+'">确认</button></div></div>'
}
function vPerson(uid){
  const u=S.people.find(p=>p.id===uid),tot=CORE().length,g=gotN(uid),pct=Math.round(g/tot*100)
  let h='<button class="btn btn-sm btn-gh" style="margin-bottom:14px" id="bBack"><i class="ti ti-arrow-left"></i>返回</button>'
    +'<div class="card"><div style="display:flex;justify-content:space-between;gap:14px;margin-bottom:14px"><div>'
    +'<div style="font-size:19px;font-weight:500">'+esc(u.name)+'</div>'
    +'<div style="font-size:12.5px;color:var(--t2);margin-top:2px">'+esc(u.user_code)+' · '+(u.user_type==='expert'?'专家':'区域经理')+' · '+esc(u.group_id||'')+'</div></div>'
    +'<div style="text-align:right"><div style="font-size:24px;font-weight:500;color:var(--nv)">'+pct+'%</div>'
    +'<div style="font-size:11px;color:var(--t3)">'+g+'/'+tot+' 章</div></div></div>'
    +'<div class="pc-k" style="height:6px"><div class="'+(g===tot?'f':'')+'" style="width:'+pct+'%"></div></div></div>'
    +'<div class="lbl">各节点状态</div><div class="card flat"><div class="card-b">'
  S.stamps.forEach(st=>{
    const t=stState(uid,st)
    if(t==='counter'){
      h+='<div class="rw"><div class="rw-i" style="background:var(--nv);color:#fff;font-size:13px;font-weight:500">'+lvN(uid)+'</div>'
        +'<div class="rw-m"><div class="rw-t">'+esc(st.name)+'</div><div class="rw-s">计数器 · 已确认 '+lvN(uid)+' 次</div></div></div>'
      return}
    const M={earned:['var(--red)','#fff','ti-rosette','已获章','ok'],pending:['var(--am-l)','var(--am)','ti-clock','待审批','wt'],
      open:['var(--bg2)','var(--t3)','ti-circle-dashed','进行中','td'],locked:['var(--bg3)','var(--t3)','ti-lock','未开放','td']}
    const c=M[t]
    h+='<div class="rw"><div class="rw-i" style="background:'+c[0]+';color:'+c[1]+'"><i class="ti '+c[2]+'"></i></div>'
      +'<div class="rw-m"><div class="rw-t">'+esc(st.name)+'</div><div class="rw-s">'+esc(st.subtitle||'')+'</div></div>'
      +'<div class="rw-r"><span class="bg '+c[4]+'">'+c[3]+'</span></div></div>'
  })
  h+='</div></div>'
  if(isMgr())h+='<button class="btn btn-nv" data-nt="'+uid+'"><i class="ti ti-send"></i>发送提醒</button>'
  return h
}
function vAdmin(){
  const ls=S.people.filter(p=>p.role==='learner'),tot=CORE().length
  let h='<div class="sts"><div class="st"><div class="st-n">'+ls.filter(p=>p.user_type==='am').length+'</div><div class="st-l">区域经理</div></div>'
    +'<div class="st"><div class="st-n">'+ls.filter(p=>p.user_type==='expert').length+'</div><div class="st-l">专家</div></div>'
    +'<div class="st"><div class="st-n">'+S.groups.length+'</div><div class="st-l">分组</div></div>'
    +'<div class="st"><div class="st-n">'+S.stamps.length+'</div><div class="st-l">打卡点</div></div></div>'
    +'<div class="lbl">各组完成率</div>'
  S.groups.forEach(g=>{
    const ps=ls.filter(p=>p.group_id===g.id&&p.must_complete)
    if(!ps.length)return
    const pct=Math.round(ps.reduce((s,p)=>s+gotN(p.id),0)/(ps.length*tot)*100)
    h+='<div class="pc" style="cursor:default"><div class="pc-t"><div><div class="pc-n">'+esc(g.name)+'</div>'
      +'<div class="pc-m">'+ps.length+' 位必修学员</div></div><div class="pc-p">'+pct+'%</div></div>'
      +'<div class="pc-k"><div style="width:'+pct+'%"></div></div></div>'
  })
  h+='<div class="lbl">全员名单</div>'+ls.sort((a,b)=>a.user_code.localeCompare(b.user_code)).map(p=>pCard(p,tot)).join('')
  return h
}

function bind(){
  const v=$('view')
  v.querySelectorAll('[data-st]').forEach(e=>e.onclick=()=>openStamp(e.dataset.st))
  v.querySelectorAll('[data-live]').forEach(e=>e.onclick=()=>go('lv'))
  v.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{S.vu=e.dataset.u;render()})
  v.querySelectorAll('[data-oks]').forEach(e=>e.onclick=()=>{const a=e.dataset.oks.split('|');apprSign(a[0],a[1])})
  v.querySelectorAll('[data-okl]').forEach(e=>e.onclick=()=>apprLive(e.dataset.okl))
  v.querySelectorAll('[data-vs]').forEach(e=>e.onclick=()=>openSub(e.dataset.vs))
  v.querySelectorAll('[data-nt]').forEach(e=>e.onclick=()=>openNotify(e.dataset.nt))
  const bk=$('bBack');if(bk)bk.onclick=()=>{S.vu=null;render()}
  const bl=$('bLive');if(bl)bl.onclick=openLiveAdd
}
function bindMo(){
  const m=$('modal')
  m.querySelectorAll('[data-si]').forEach(e=>e.onclick=()=>doSignin(e.dataset.si))
  m.querySelectorAll('[data-up]').forEach(e=>e.onclick=()=>$('f_'+e.dataset.up).click())
  m.querySelectorAll('input[type=file]').forEach(i=>i.onchange=()=>doUp(i.id.slice(2),i.files[0]))
}

async function doSignin(sid){
  const p=pOf(S.me.id,sid)
  await sb.from('stamp_progress').update({status:'signed_in',signed_in_at:new Date().toISOString()}).eq('id',p.id)
  closeMo();await loadAll();buildNav()
  cel('签到成功','已提交，等待确认后即可获得印章')
}
async function doUp(aid,f){
  if(!f)return
  if(f.size>10*1024*1024){alert('文件不能超过 10MB');return}
  const ext=f.name.split('.').pop(),path=S.me.id+'/'+aid+'_'+Date.now()+'.'+ext
  const up=await sb.storage.from('assignments').upload(path,f)
  if(up.error){alert('上传失败：'+up.error.message);return}
  const old=S.subs.find(s=>s.user_id===S.me.id&&s.assignment_id===aid)
  if(old)await sb.from('submissions').update({file_path:path,file_name:f.name,status:'submitted',note:null,submitted_at:new Date().toISOString()}).eq('id',old.id)
  else await sb.from('submissions').insert({user_id:S.me.id,assignment_id:aid,file_path:path,file_name:f.name,status:'submitted'})
  closeMo();await loadAll();render()
  cel('提交成功','作业已上传，等待审批')
}
async function apprSign(pid,role){
  const now=new Date().toISOString(),p=S.prog.find(x=>x.id===pid),st=S.stamps.find(x=>x.id===p.stamp_id)
  const u={status:'pending'}
  u[role+'_ok_at']=now;u[role+'_ok_by']=S.me.id
  const h={hrbp:p.hrbp_ok_at,rad:p.rad_ok_at,hr:p.hr_ok_at};h[role]=now
  const done=['hrbp','rad','hr'].every(r=>!st['needs_'+r]||h[r])
  if(done){u.status='earned';u.earned_at=now}
  await sb.from('stamp_progress').update(u).eq('id',pid)
  const rn={hrbp:'HRBP',rad:'组长',hr:'HR'}[role]
  await notif(p.user_id,done?'恭喜！你已获得「'+st.name+'」印章':'「'+st.name+'」已通过'+rn+'确认')
  await loadAll();buildNav()
  if(done){
    const nm=S.people.find(x=>x.id===p.user_id)
    cel('印章已盖上',(nm?nm.name:'')+' 已获得「'+st.name+'」')
  }
}
async function apprLive(id){
  await sb.from('live_checkins').update({confirmed:true,confirmed_by:S.me.id,confirmed_at:new Date().toISOString()}).eq('id',id)
  await loadAll();buildNav()
}
function openSub(sid){
  const s=S.subs.find(x=>x.id===sid),a=S.assigns.find(x=>x.id===s.assignment_id),u=S.people.find(p=>p.id===s.user_id)
  modal(a.title,(u?u.name:'')+' · '+fmt(s.submitted_at),
    '<div class="fr" style="margin:0 0 14px"><i class="ti ti-file-spreadsheet"></i>'
    +'<div class="fr-n">'+esc(s.file_name||'')+'</div>'
    +'<button class="btn btn-sm btn-gh" id="dlBtn"><i class="ti ti-download"></i>下载</button></div>'
    +'<div style="font-size:12.5px;color:var(--t2);margin-bottom:14px;line-height:1.6">'+esc(a.description||'')+'</div>'
    +'<textarea class="ta" id="rvN" placeholder="退回时请填写原因（批准可不填）"></textarea>'
    +'<div style="display:flex;gap:9px;margin-top:12px">'
    +'<button class="btn" id="apBtn"><i class="ti ti-check"></i>批准</button>'
    +'<button class="btn btn-gh" id="rjBtn">退回修改</button></div>')
  $('dlBtn').onclick=async()=>{
    const r=await sb.storage.from('assignments').createSignedUrl(s.file_path,3600)
    if(r.data&&r.data.signedUrl)window.open(r.data.signedUrl,'_blank')
    else alert('无法生成下载链接')
  }
  $('apBtn').onclick=()=>revSub(sid,'approved')
  $('rjBtn').onclick=()=>revSub(sid,'rejected')
}
async function revSub(sid,status){
  const el=$('rvN'),note=el?el.value.trim():''
  if(status==='rejected'&&!note){alert('退回时请填写原因');return}
  const s=S.subs.find(x=>x.id===sid),a=S.assigns.find(x=>x.id===s.assignment_id)
  await sb.from('submissions').update({status:status,note:note||null,reviewed_at:new Date().toISOString(),reviewed_by:S.me.id}).eq('id',sid)
  const ids=S.assigns.filter(x=>x.stamp_id===a.stamp_id).map(x=>x.id)
  const oth=S.subs.filter(x=>x.user_id===s.user_id&&ids.includes(x.assignment_id)&&x.id!==sid)
  if(status==='approved'&&oth.length===ids.length-1&&oth.every(x=>x.status==='approved')){
    const p=pOf(s.user_id,a.stamp_id),st=S.stamps.find(x=>x.id===a.stamp_id),now=new Date().toISOString()
    const u={status:'pending'};u[S.me.role+'_ok_at']=now
    const h={hrbp:p.hrbp_ok_at,rad:p.rad_ok_at,hr:p.hr_ok_at};h[S.me.role]=now
    if(['hrbp','rad','hr'].every(r=>!st['needs_'+r]||h[r])){u.status='earned';u.earned_at=now}
    await sb.from('stamp_progress').update(u).eq('id',p.id)
  }
  await notif(s.user_id,status==='approved'?'作业「'+a.title+'」已通过审批':'作业「'+a.title+'」被退回：'+note)
  closeMo();await loadAll();buildNav()
}
function notif(uid,body){return sb.from('notifications').insert({to_user:uid,from_user:S.me.id,body:body})}
function openNotify(uid){
  const u=S.people.find(p=>p.id===uid)
  modal('发送提醒',u?u.name:'','<textarea class="ta" id="ntB" placeholder="例如：请尽快完成主题5的三项作业提交"></textarea>'
    +'<button class="btn" style="margin-top:12px" id="ntS"><i class="ti ti-send"></i>发送</button>')
  $('ntS').onclick=async()=>{
    const b=$('ntB').value.trim();if(!b)return
    await notif(uid,b);closeMo();cel('已发送','提醒已推送到对方的消息中心')
  }
}
function openLiveAdd(){
  modal('新增直播课打卡','请填写本次课程名称',
    '<div class="fld"><label>课程名称</label><input id="lvNm" type="text" placeholder="例如 言语测试基础"></div>'
    +'<button class="btn" id="lvG"><i class="ti ti-check"></i>提交打卡</button>')
  $('lvG').onclick=async()=>{
    const n=$('lvNm').value.trim();if(!n){alert('请填写课程名称');return}
    await sb.from('live_checkins').insert({user_id:S.me.id,session_name:n})
    closeMo();await loadAll();render();cel('打卡成功','等待 HRBP 确认后计入次数')
  }
}
async function openNotifs(){
  const l=S.notifs,un=l.filter(n=>!n.read_at)
  modal('消息中心',un.length?un.length+' 条未读':'全部已读',
    l.length?l.map(n=>'<div class="nt '+(n.read_at?'':'new')+'"><div class="nt-b">'+esc(n.body)+'</div><div class="nt-m">'+fmt(n.created_at)+'</div></div>').join('')
    :'<div class="emp"><i class="ti ti-inbox"></i><div class="emp-t">暂无消息</div></div>')
  if(un.length){
    await sb.from('notifications').update({read_at:new Date().toISOString()}).in('id',un.map(n=>n.id))
    await loadAll()
  }
}

function modal(t,s,b){
  $('modal').innerHTML='<div class="ov" id="ov"><div class="mo"><div class="mo-h"><div>'
    +'<div class="mo-t">'+esc(t)+'</div>'+(s?'<div class="mo-s">'+esc(s)+'</div>':'')+'</div>'
    +'<button class="mo-x" id="moX" aria-label="关闭">&times;</button></div><div class="mo-b">'+b+'</div></div></div>'
  $('moX').onclick=closeMo
  $('ov').onclick=e=>{if(e.target.id==='ov')closeMo()}
  bindMo()
}
function cel(t,s){
  $('modal').innerHTML='<div class="ov" id="ov"><div class="mo"><div class="mo-c">'
    +'<div class="mo-cr"><i class="ti ti-rosette"></i></div>'
    +'<div class="mo-t">'+esc(t)+'</div><div class="mo-s" style="margin-top:6px">'+esc(s)+'</div>'
    +'<button class="btn" style="margin-top:22px" id="cOk">好的</button></div></div></div>'
  $('cOk').onclick=closeMo
  $('ov').onclick=e=>{if(e.target.id==='ov')closeMo()}
}
function closeMo(){$('modal').innerHTML=''}
</script>
</body>
